---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: laptop-bluefin-kwin
description: Personal Bluefin image with a reproducibly patched downstream KWin build.
base-image: ghcr.io/ublue-os/aurora
image-version: latest

stages:
  - name: kwin-builder
    from: ghcr.io/ublue-os/aurora:latest
    modules:
      - type: containerfile
        snippets:
          - |
            RUN set -euxo pipefail && \
                dnf install -y \
                  cmake \
                  extra-cmake-modules \
                  gcc-c++ \
                  gettext \
                  git \
                  libdrm-devel \
                  libepoxy-devel \
                  libinput-devel \
                  libwayland-client \
                  libwayland-cursor \
                  libwayland-egl \
                  libwayland-server \
                  libxml2-devel \
                  mesa-libgbm-devel \
                  meson \
                  ninja-build \
                  pkgconf-pkg-config \
                  qt6-qtbase-devel \
                  qt6-qtbase-private-devel \
                  qt6-qtdeclarative-devel \
                  qt6-qtpositioning-devel \
                  qt6-qtsvg-devel \
                  qt6-qttools-devel \
                  qt6-qtwayland-devel \
                  wayland-devel \
                  wayland-protocols-devel \
                  xcb-util-devel \
                  xcb-util-keysyms-devel \
                  xcb-util-wm-devel \
                  kdecoration-devel \
                  kf6-kcmutils-devel \
                  kf6-kconfig-devel \
                  kf6-kconfigwidgets-devel \
                  kf6-kcoreaddons-devel \
                  kf6-kcrash-devel \
                  kf6-kdbusaddons-devel \
                  kf6-kdeclarative-devel \
                  kf6-kglobalaccel-devel \
                  kf6-kguiaddons-devel \
                  kf6-ki18n-devel \
                  kf6-kiconthemes-devel \
                  kf6-kidletime-devel \
                  kf6-kio-devel \
                  kf6-kirigami-devel \
                  kf6-knewstuff-devel \
                  kf6-knotifications-devel \
                  kf6-krunner-devel \
                  kf6-kservice-devel \
                  kf6-ksvg-devel \
                  kf6-ktextwidgets-devel \
                  kf6-kwidgetsaddons-devel \
                  kf6-kwindowsystem-devel \
                  kf6-kholidays-devel \
                  kglobalacceld-devel \
                  knighttime-devel \
                  kwayland-devel \
                  kscreenlocker-devel \
                  libcap-devel \
                  libcanberra-devel \
                  libdisplay-info-devel \
                  libxcvt-devel \
                  libxkbcommon-devel \
                  libxkbcommon-x11-devel \
                  lcms2-devel \
                  systemd-devel \
                  vulkan-loader-devel \
                  xorg-x11-server-Xwayland-devel && \
                dnf clean all
      - type: containerfile
        snippets:
          - COPY patches/kwin/overview-3-finger.patch /tmp/overview-3-finger.patch
      - type: script
        scripts:
          - build-kwin.sh

modules:
  - from-file: packages.yml
  - type: copy
    from: kwin-builder
    src: /out/
    dest: /
  - from-file: flatpaks.yml
  - from-file: nixdir.yml
  - type: signing
