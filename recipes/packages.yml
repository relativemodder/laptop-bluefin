---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - atim/resources
        - daniel-g-carrasco/wayland-scroll-factor
        - aneagle/gnome-rounded-blur
    install:
      packages:
        - kvantum
        - fuse-libs
        - mangohud
        - resources
        - wayland-scroll-factor
        - gnome-rounded-blur
        - libvirtd
        - qemu
        - dnsmasq
        - libvirt-daemon-driver-qemu
    remove:
      packages:
        - firefox
        - firefox-langpacks
