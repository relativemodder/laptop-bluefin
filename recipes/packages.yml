---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - atim/resources
    install:
      packages:
        - fuse-libs
        - mangohud
        - resources
        - libvirtd
        - qemu
        - dnsmasq
        - libvirt-daemon-driver-qemu
    remove:
      packages:
        - firefox
        - firefox-langpacks
