---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: containerfile
snippets:
  - |
    RUN set -euxo pipefail && \
        dnf install -y sddm sddm-kcm && \
        dnf remove -y plasma-login-manager kcm-plasmalogin kde-settings-plasmalogin && \
        dnf clean all
  - |
    RUN set -euxo pipefail && \
        rm -f /etc/systemd/system/display-manager.service && \
        ln -s /usr/lib/systemd/system/sddm.service \
          /etc/systemd/system/display-manager.service
